<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argus · CVE Threat Dashboard</title>
  <meta name="description" content="CVE 취약점 위협 인텔리전스 대시보드 — 실제 악용·무기화·고위험 취약점을 한눈에.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231f6feb' d='M12 1.5 3.5 5v6.2c0 5.4 3.6 10.4 8.5 11.8 4.9-1.4 8.5-6.4 8.5-11.8V5z'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round' d='m8.3 12 2.5 2.5 4.9-5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="cve.html" class="logo">
        <span class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span>Argus<small>CVE Threat Intelligence</small></span>
      </a>
      <div class="header-spacer"></div>
      <div class="header-meta">
        <span class="live-dot">자동 수집 중</span>
        <span class="updated-at">업데이트 <b id="updated-time">-</b></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="kpi-grid">
      <div class="kpi is-new">
        <div class="kpi-label" title="악용 신호가 관측됐거나(T0·T1) 고위험이 될 가능성이 있는 건(T2)만 여기 올라옵니다. 점수만 높고 근거가 없는 건은 저장하지 않습니다 — 실측으로 하루 128~162건이 그런 경우였습니다.">추적 중 CVE</div>
        <div class="kpi-value" id="stat-total">-</div>
        <div class="kpi-sub" id="stat-24h-sub">최근 24시간 - 건 신규</div>
      </div>
      <div class="kpi is-kev">
        <div class="kpi-label" title="CISA KEV · VulnCheck KEV · SSVC Exploitation=active · Metasploit 모듈 — 악용이 보고된 건입니다. 즉시 알림이 나갑니다.">🚨 악용 중</div>
        <div class="kpi-value c-kev" id="stat-t0">-</div>
        <div class="kpi-sub">즉시 알림 대상</div>
      </div>
      <div class="kpi is-critical">
        <div class="kpi-label" title="nuclei 템플릿 · Exploit-DB · EPSS 상위 1% — 악용 보고는 없지만 공격 도구가 이미 공개된 건입니다. 즉시 알림이 나갑니다.">⚠️ 무기화 임박</div>
        <div class="kpi-value c-critical" id="stat-t1">-</div>
        <div class="kpi-sub">즉시 알림 대상</div>
      </div>
      <div class="kpi">
        <div class="kpi-label" title="고위험이 '될' 가능성이 있는 건. 알림은 보내지 않고 여기서 관측합니다 — 신호가 하나라도 붙으면 T0/T1로 올라가 알림이 나갑니다.">📋 관찰</div>
        <div class="kpi-value" id="stat-t2">-</div>
        <div class="kpi-sub">알림 없이 추적</div>
      </div>
      <div class="kpi is-weapon">
        <div class="kpi-label" title="Metasploit 모듈 · Exploit-DB · nuclei 템플릿 — 공격 도구가 공개된 건 (위험 등급과 직교하는 축)">🧨 무기화됨</div>
        <div class="kpi-value c-weapon" id="stat-weapon">-</div>
        <div class="kpi-sub">Metasploit · EDB · nuclei</div>
      </div>
    </section>

    <section class="panels">
      <div class="panel">
        <h3>📈 일별 공개 추이 <span style="font-weight:500;color:var(--text-faint);text-transform:none;letter-spacing:0;">CVE 공개일 기준 · 최근 30일<span id="trend-coverage"></span></span></h3>
        <div class="chart-container"><canvas id="trend-chart"></canvas></div>
      </div>
      <div class="panel">
        <h3>심각도 분포</h3>
        <div id="severity-dist"></div>
        <h3 class="mt">영향 제품 TOP</h3>
        <div id="product-dist"></div>
      </div>
    </section>

    <section class="filter-bar">
      <div class="filter-row">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" class="search-input" id="search-input" placeholder="CVE ID · 키워드 검색…">
        </div>
        <select class="filter-select" id="vendor-filter" title="벤더로 좁히기"><option value="">전체 벤더</option></select>
        <select class="filter-select" id="product-filter" title="제품으로 좁히기"><option value="">전체 제품</option></select>
        <select class="filter-select" id="month-filter" title="월별 조회"><option value="">전체 기간</option></select>
        <select class="filter-select" id="day-filter" title="일별 조회 (월 선택 시 해당 월의 날짜만)"><option value="">전체 일자</option></select>
      </div>

      <div class="filter-row">
        <div class="seg" id="severity-seg">
          <button class="seg-btn active sev-c-critical" data-severity="Critical"><span class="dot" style="background:var(--sev-critical)"></span>Critical</button>
          <button class="seg-btn active sev-c-high" data-severity="High"><span class="dot" style="background:var(--sev-high)"></span>High</button>
          <button class="seg-btn active sev-c-medium" data-severity="Medium"><span class="dot" style="background:var(--sev-medium)"></span>Medium</button>
          <button class="seg-btn active sev-c-low" data-severity="Low"><span class="dot" style="background:var(--sev-low)"></span>Low</button>
        </div>
        <div class="seg">
          <button class="seg-btn signal" data-signal="kev">🚨 악용 중</button>
          <button class="seg-btn signal" data-signal="weaponized">🧨 무기화</button>
          <button class="seg-btn signal" data-signal="poc">🔬 PoC</button>
          <button class="seg-btn signal" data-signal="rules">🛡️ 공개 룰</button>
          <button class="seg-btn signal" data-signal="auto" title="CISA SSVC Automatable=yes — 점수가 낮아도 대량 자동 공격 대상">🤖 자동화 가능</button>
          <button class="seg-btn signal" data-signal="ai" title="AI가 찾아 책임공개된 취약점 (Anthropic CVD의 ANT ID, Google Big Sleep, ZeroPath 등). 공개 시점에 이미 패치된 경우가 많지만 상세가 함께 공개됩니다.">🧠 AI 발견</button>
          <button class="seg-btn signal" data-signal="patched" title="OSV가 수정 버전을 알려주는 건 — 올릴 목표가 있는 것부터 처리할 때">🩹 패치 있음</button>
          <button class="seg-btn signal" data-signal="alerted" title="Slack 즉시 알림이 나간 건만. 악용 중·무기화 임박이 여기 해당하고, 관찰 구간은 빠집니다.">🔔 알림 나간 건</button>
        </div>
        <select class="filter-select" id="kernel-filter" title="Linux 커널 CVE는 전부 Linux/Linux로만 표기돼 제품 구분이 없습니다. 커널은 CVE마다 고치는 게 아니라 패키지를 한 번 올리는 단위라, 나머지를 훑을 땐 제외하고 보는 편이 낫습니다.">
          <option value="">커널 포함</option>
          <option value="hide">커널 제외</option>
          <option value="only">커널만</option>
        </select>

        <div class="filter-spacer"></div>
        <div class="export-group">
          <button class="export-btn export-highrisk" onclick="exportHighRiskByMonth()" title="선택 월의 고위험(Critical/High)을 CSV로">고위험 CVE ↓</button>
          <button class="export-btn" onclick="exportData('csv')" title="필터된 목록 CSV">CSV ↓</button>
          <button class="export-btn" onclick="exportData('json')" title="필터된 목록 JSON">JSON ↓</button>
          <button class="export-btn" onclick="exportData('stix')" title="필터된 목록 STIX 2.1">STIX ↓</button>
        </div>
      </div>
    </section>

    <div class="loading" id="loading">불러오는 중…</div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="cell-sev sortable" data-sort="tier" title="파이프라인이 알림을 보낼 때 쓰는 것과 같은 위험 등급 · CVSS 심각도">위험 등급 · 심각도</th>
              <th class="sortable" data-sort="id">CVE ID</th>
              <th>취약점</th>
              <th class="sortable" data-sort="cvss">CVSS</th>
              <th class="sortable" data-sort="epss">EPSS</th>
              <th>위협 신호</th>
              <th>영향 벤더</th>
              <th class="sortable" data-sort="date">탐지일</th>
            </tr>
          </thead>
          <tbody id="cve-table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="pagination">
      <button id="prev-btn" onclick="changePage(-1)">&laquo; 이전</button>
      <span class="page-info" id="page-info">-</span>
      <button id="next-btn" onclick="changePage(1)">다음 &raquo;</button>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-hero" id="modal-hero">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-hero-top">
          <span class="m-id" id="modal-id">CVE</span>
          <span id="modal-sev-badge"></span>
          <span class="sig-badges" id="modal-signals"></span>
        </div>
        <h2 id="modal-title">-</h2>
        <div class="modal-scores" id="modal-scores"></div>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/chart.js"></script>
  <script src="js/cve-dashboard.js"></script>
</body>
</html>
