name: Argus Fast Lane

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # 스냅샷 대조로 잡힌 고위험 건의 리포트 발행

concurrency:
  group: argus-fast
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache signal indexes
        uses: actions/cache@v4
        with:
          path: .cache/rulesets
          key: signals-${{ github.run_id }}
          restore-keys: |
            signals-

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes

      - name: Static check
        run: python tests/test_lint.py

      - name: Regression tests
        run: |
          set -e
          for t in tests/test_*.py; do
            [ "$t" = "tests/test_lint.py" ] && continue
            echo "── $t"; python "$t"
          done

      - name: Run fast lane
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
        run: python src/fast_lane.py
