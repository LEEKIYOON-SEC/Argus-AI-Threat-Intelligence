name: Argus Maintenance

on:
  schedule:
    - cron: '40 3 * * 0'
  workflow_dispatch:
    inputs:
      task:
        description: '실행할 작업'
        type: choice
        default: 'package-index'
        options:
          - package-index
          - rule-index
          - backfill-published
          - backfill-vendors
          - backfill-exploited
          - backfill-cvss
          - backfill-signals
          - drop-report-urls
          - turso-check
      backfill_days:
        description: '공개일 백필 소급 기간(일) — 2024년 이전까지 채우려면 7000'
        default: '400'
      dry_run:
        description: 'backfill-cvss·signals: 계산만 하고 저장하지 않기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: argus-pipeline
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.carry.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build package index
        if: ${{ github.event_name == 'schedule' || inputs.task == 'package-index' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/build_package_index.py

      - name: Build detection rule index
        if: ${{ github.event_name == 'schedule' || inputs.task == 'rule-index' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/build_rule_index.py

      - name: Backfill published dates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-published' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python src/backfill_published.py

      - name: Backfill currently exploited (KEV)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-exploited' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
          BACKFILL_LIMIT: '800'
        run: python src/backfill_exploited.py

      - name: Backfill CVSS versions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-cvss' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BACKFILL_CVSS_LIMIT: '1500'
          BACKFILL_CVSS_NVD_BUDGET: '2400'
        run: python src/backfill_cvss.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Reconcile SSVC signals
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-signals' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/backfill_signals.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Drop legacy report URLs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'drop-report-urls' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/drop_report_urls.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Check Turso connection and apply schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'turso-check' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python src/turso_check.py

      - name: Backfill affected vendors
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'backfill-vendors') }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python src/backfill_vendors.py

      - name: Carry forward published data
        id: carry
        if: ${{ github.event_name == 'schedule' || inputs.task == 'package-index' || inputs.task == 'rule-index' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGUS_FRESH_FILES: cve-packages.json,detection-rules.json
        run: python src/fetch_published.py

      - name: Upload Pages artifact
        if: ${{ steps.carry.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: maintenance
    if: ${{ needs.maintenance.outputs.artifact == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
