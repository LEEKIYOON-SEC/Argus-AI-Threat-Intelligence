name: Argus CVE Monitor
 
on:
  # 스케줄 일시 중지 — Groq/Gemini 일일 한도(TPD/RPD) 보존을 위해 자동 실행을 멈춘다.
  # 자산 기준 티어링 반영·테스트 후 아래 두 줄 주석을 해제해 재개.
  schedule:
     - cron: '18 * * * *'  # 매시 18분 자동 실행
  workflow_dispatch:  # 수동 실행 가능 (테스트용으로 유지)
 
permissions:
  contents: read      # 데이터 파일을 더는 커밋하지 않는다 (Pages 아티팩트로 배포)
  issues: write

# 동시 실행 방지 — 백로그 해소 중 실행이 길어져 다음 정시 실행과 겹치면
# 워터마크 경합·중복 처리가 생길 수 있다. 실행 중이면 다음 실행은 대기(취소 아님).
concurrency:
  group: argus-pipeline
  cancel-in-progress: false
 
jobs:
  argus-run:
    runs-on: ubuntu-latest
    # 파이프라인은 soft_deadline_minutes(38분)에 스스로 마무리·워터마크 저장 후 종료한다.
    # 이 값은 그게 실패했을 때의 최후 안전장치 (셋업+export+commit 여유 포함).
    timeout-minutes: 45
    # 필수 데이터를 확보하지 못하면 아티팩트를 올리지 않고, 배포 잡도 건너뛴다 —
    # 반쪽짜리 사이트를 올리느니 직전 배포를 그대로 두는 편이 낫다.
    outputs:
      artifact: ${{ steps.carry.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 룰셋/인덱스 tarball·CSV 디스크 캐시 (일 단위 키) — 매시간 재다운로드 제거
      - name: Cache rulesets
        uses: actions/cache@v4
        with:
          path: .cache/rulesets
          key: rulesets-${{ github.run_id }}
          restore-keys: |
            rulesets-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Argus CVE pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/main.py
 
      # if: always() — 파이프라인이 중간에 실패해도, 이미 정상 저장된 워터마크/대시보드
      # 데이터는 커밋한다 (워터마크 파일은 _main 말미에만 쓰이므로 잘못 전진할 일 없음).
      # GH_TOKEN/GITHUB_REPOSITORY: 대응 상태 동기화(이슈 닫힘·라벨)와 주간 리포트 발행에 사용
      - name: Export dashboard data
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/export_dashboard_data.py

      # 배포는 사이트 전체를 갈아끼운다. 이 잡이 만들지 않은 파일(주 1회 생성되는
      # 패키지 인덱스 등)은 지금 서비스 중인 사이트에서 받아 채운다.
      # 필수 파일을 확보하지 못하면 0이 아닌 값을 반환해 아래 배포 단계를 건너뛴다.
      - name: Carry forward published data
        id: carry
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARGUS_FRESH_FILES: cves.json,stats.json
        run: python src/fetch_published.py

      - name: Upload Pages artifact
        if: always() && steps.carry.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # 배포는 별도 잡으로 뗀다. Pages 배포는 리포 전체에 하나뿐인 자원이라 주간
  # 인덱스 잡과 겹칠 수 있어, 파이프라인(argus-pipeline)과 다른 동시성 그룹으로
  # 직렬화해야 한다. 한 잡에는 동시성 그룹을 하나만 걸 수 있다.
  deploy:
    needs: argus-run
    if: always() && needs.argus-run.outputs.artifact == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # actions/deploy-pages
      id-token: write     # deploy-pages의 OIDC 검증
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
